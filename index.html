<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/folio/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Folio — portofolio Muhammad Tegar Pamungkas, full stack & mobile developer. Aplikasi enterprise, mobile, dan website dengan live preview.">
  <meta name="theme-color" content="#F5F3EE">
  <meta name="color-scheme" content="light dark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Folio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Folio — Portofolio Muhammad Tegar Pamungkas</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; background: #F5F3EE; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #0F0F0E; }
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    Optional high-refresh-rate shim (worker clock + OffscreenCanvas), vendored
    from https://github.com/aumb/flutter_shim (MIT).

    Off by default. Measured with SurfaceFlinger on a 120 Hz phone (Poco X3
    NFC, Chrome 155): the shim lifts requestAnimationFrame to ~120, but frames
    that actually reach the display stay at 60 or fewer during scrolling, and
    there are more dropped frames than on the plain 60 fps path (44-56 vs
    62-74 presented). It only helps light, animation-only screens.

    ?shim=on      enable the shim
    ?shim=off     explicit opt-out (kept so old links still work)
    ?shim-desktop enable the Android/Chrome path on a desktop Chromium build
                  (for example with Chrome's ThrottleMainFrameTo60Hz
                  feature enabled)
  -->
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      if (!params.has('shim-desktop') && params.get('shim') !== 'on') return;
      if (params.has('shim-desktop')) {
        window.flutterShimConfig = { anyPlatform: true };
      }
      document.write('<script src="flutter_shim.js"><\/script>');
    })();
  </script>
  <script>
    // One-time cleanup for visitors who still have the old PWA service worker.
    // The portfolio is served fresh; stale cached builds hid new projects.
    (() => {
      if (!('serviceWorker' in navigator)) return;
      try {
        const key = 'folio:sw-cleanup:v3';
        if (localStorage.getItem(key)) return;
        navigator.serviceWorker.getRegistrations().then((regs) => {
          if (!regs.length) {
            localStorage.setItem(key, '1');
            return;
          }
          Promise.all(regs.map((r) => r.unregister()))
            .then(() => ('caches' in window ? caches.keys() : []))
            .then((keys) => Promise.all(keys.map((k) => caches.delete(k))))
            .then(() => {
              localStorage.setItem(key, '1');
              window.location.reload();
            });
        });
      } catch (_) {}
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
