<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Folio — portofolio Muhammad Tegar Pamungkas, full stack & mobile developer. Aplikasi enterprise, mobile, dan website dengan live preview.">
  <meta name="theme-color" content="#F5F3EE">
  <meta name="color-scheme" content="light dark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Folio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Folio — Portofolio Muhammad Tegar Pamungkas</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; background: #F5F3EE; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #0F0F0E; }
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    High-refresh-rate renderer for Chrome on Android (120 Hz). Loaded by
    default there and skipped on desktop, Safari, and other browsers.
    Vendored from https://github.com/aumb/flutter_shim (MIT).

    ?shim=off    keep the stable 60 fps path
    ?shim=on     force the shim even if platform detection fails
    ?shim-desktop test the Android/Chrome path on a desktop Chromium build
                  (for example with Chrome's ThrottleMainFrameTo60Hz
                  feature enabled)
  -->
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      if (params.has('shim-desktop')) {
        window.flutterShimConfig = { anyPlatform: true };
      }
      const ua = navigator.userAgent;
      const isAndroidChrome =
        /Android/.test(ua) &&
        /(Chrome|Chromium)\//.test(ua) &&
        !/(EdgA|OPR|SamsungBrowser|Firefox|UCBrowser|YaBrowser)\//.test(ua);
      const choice = params.get('shim');
      const wantsHighRefresh =
        choice === 'on' ||
        params.has('shim-desktop') ||
        (choice !== 'off' && isAndroidChrome);
      if (wantsHighRefresh) {
        document.write('<script src="flutter_shim.js"><\/script>');
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
